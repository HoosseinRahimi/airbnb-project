name: App smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start app and check health
        shell: bash
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat streamlit.log
          exit 1
